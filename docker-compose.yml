version: '3.8'

services:
  spotify-looper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-looper-web
    ports:
      - "8000:8000"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-9a6f10a547204621b452aa9d90c23efe}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - JWT_EXPIRES_MIN=43200
      - LOOP_POLL_MS=200
      - USER_ACTION_GRACE_MS=500
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for scaling WebSocket connections across multiple instances
